<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #020617; }
      .b-c { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; }
      .b-s { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; }
      .b-d { fill: #064e3b; stroke: #34d399; stroke-width: 2; }
      .t-t { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .t-b { font-family: system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .t-ac { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #38bdf8; }
      .t-as { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #a5b4fc; }
      .al { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .al-a { stroke: #38bdf8; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" />

  <!-- Client Side Big Box -->
  <rect x="20" y="30" width="410" height="460" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="35" y="55" class="t-ac">REACT 19 SPA CLIENT</text>

  <!-- Server Side Big Box -->
  <rect x="490" y="30" width="410" height="460" rx="8" fill="none" stroke="#818cf8" stroke-width="1.5" />
  <text x="505" y="55" class="t-as">EXPRESS Headless Server</text>

  <!-- Client components -->
  <rect x="40" y="80" width="160" height="150" rx="6" class="b-c" />
  <text x="55" y="105" class="t-t">Visual UI Layers</text>
  <text x="55" y="130" class="t-b">- App &amp; Sidebar</text>
  <text x="55" y="150" class="t-b">- BookCarousel</text>
  <text x="55" y="170" class="t-b">- ReaderPanel</text>
  <text x="55" y="190" class="t-b">- TTSPlayer Console</text>
  <text x="55" y="210" class="t-b">- ShareCardModal</text>

  <rect x="240" y="80" width="160" height="150" rx="6" class="b-c" />
  <text x="255" y="105" class="t-t">Custom React Hooks</text>
  <text x="255" y="130" class="t-b" fill="#38bdf8">useTTS.ts</text>
  <text x="255" y="150" class="t-b">- Speech Control</text>
  <text x="255" y="170" class="t-b" fill="#38bdf8">usePWAStatus.ts</text>
  <text x="255" y="190" class="t-b">- Install prompted</text>
  <text x="255" y="210" class="t-b">- Online tracker</text>

  <rect x="40" y="260" width="360" height="90" rx="6" class="b-c" />
  <text x="55" y="285" class="t-t">Browser System APIs</text>
  <text x="55" y="310" class="t-b">- SpeechSynthesis (vocal rendering engine)</text>
  <text x="55" y="330" class="t-b">- CanvasRenderingContext2D (card export tool)</text>

  <rect x="40" y="380" width="360" height="90" rx="6" class="b-c" />
  <text x="55" y="405" class="t-t">Service Worker network interceptor (sw.js)</text>
  <text x="55" y="430" class="t-b">- Static assets cache (Stale-while-revalidate)</text>
  <text x="55" y="450" class="t-b">- API route lookup cache (Network first with fallback)</text>

  <!-- Server components -->
  <rect x="520" y="80" width="160" height="150" rx="6" class="b-s" />
  <text x="535" y="105" class="t-t">API Controllers</text>
  <text x="535" y="130" class="t-b" fill="#a5b4fc">/fetch-devotional</text>
  <text x="535" y="150" class="t-b">- Lookup coordinator</text>
  <text x="535" y="180" class="t-b" fill="#a5b4fc">/scrape-devotionals</text>
  <text x="535" y="200" class="t-b">- Return static list</text>

  <rect x="710" y="80" width="160" height="150" rx="6" class="b-s" />
  <text x="725" y="105" class="t-t">Integrations Agent</text>
  <text x="725" y="130" class="t-b" fill="#fde047">Google GenAI</text>
  <text x="725" y="150" class="t-b">- Gemini-3.5-Flash</text>
  <text x="725" y="180" class="t-b" fill="#fbbf24">Upstream scraper</text>
  <text x="725" y="200" class="t-b">- DOM parser agent</text>

  <rect x="520" y="260" width="350" height="90" rx="6" class="b-s" />
  <text x="535" y="285" class="t-t">SQLite Database Coordinator</text>
  <text x="535" y="310" class="t-b">- node:sqlite DatabaseSync instance wrapper</text>
  <text x="535" y="330" class="t-b">- Execution schema parser &amp; transactions writer</text>

  <rect x="520" y="380" width="350" height="90" rx="6" class="b-d" />
  <text x="535" y="405" class="t-t" fill="#34d399">devotionals.db file (Disk Cache Storage)</text>
  <text x="535" y="430" class="t-b">- Pre-built via scripts/build_db.py pipeline</text>
  <text x="535" y="450" class="t-b">- Stores paraphrased paragraphs list under indexed key</text>

  <!-- Connectors -->
  <!-- Hooks to UI -->
  <path d="M 240 150 L 200 150" class="al-a" marker-end="url(#arrow-active)" />

  <!-- UI to Browser APIs -->
  <path d="M 110 230 L 110 260" class="al" marker-end="url(#arrow)" />

  <!-- Browser APIs to SW -->
  <path d="M 220 350 L 220 380" class="al" marker-end="url(#arrow)" />

  <!-- Client SW to Server API Controllers -->
  <path d="M 400 425 L 460 425 L 460 150 L 520 150" class="al-a" marker-end="url(#arrow-active)" />

  <!-- API to Database coordinator -->
  <path d="M 600 230 L 600 260" class="al-a" marker-end="url(#arrow-active)" />

  <!-- API to Integrations -->
  <path d="M 680 150 L 710 150" class="al" marker-end="url(#arrow)" />

  <!-- DB coordinator to Disk File -->
  <path d="M 695 350 L 695 380" class="al-a" marker-end="url(#arrow-active)" />
</svg>
