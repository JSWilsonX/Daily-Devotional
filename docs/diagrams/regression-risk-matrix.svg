<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #020617; }
      .b-crit { fill: #450a0a; stroke: #f43f5e; stroke-width: 2; }
      .b-high { fill: #451a03; stroke: #f59e0b; stroke-width: 2; }
      .b-mod { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; }
      .t-t { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .t-b { font-family: system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .t-lbl-c { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #f43f5e; }
      .t-lbl-h { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #f59e0b; }
      .t-lbl-m { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #38bdf8; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" />

  <!-- Critical Column -->
  <rect x="30" y="40" width="230" height="300" rx="8" class="b-crit" />
  <text x="45" y="70" class="t-lbl-c">CRITICAL RISK</text>
  <path d="M 45 85 L 245 85" stroke="#f43f5e" stroke-width="1.5" />
  
  <text x="45" y="110" class="t-t">Timezone Drift resets</text>
  <text x="45" y="130" class="t-b">- Stored UTC date comparison can</text>
  <text x="45" y="145" class="t-b">  accidentally break habit streaks.</text>

  <text x="45" y="185" class="t-t">TTS iOS Utterance Deadlocks</text>
  <text x="45" y="205" class="t-b">- Programmatic speech queue hangs</text>
  <text x="45" y="220" class="t-b">  without explicit gesture unlocks.</text>

  <text x="45" y="260" class="t-t">API Key client exposure</text>
  <text x="45" y="280" class="t-b">- Key leaking in browser codes</text>
  <text x="45" y="295" class="t-b">  enabling malicious abuse.</text>


  <!-- High Risk Column -->
  <rect x="290" y="40" width="230" height="300" rx="8" class="b-high" />
  <text x="305" y="70" class="t-lbl-h">HIGH REGRESSION RISK</text>
  <path d="M 305 85 L 505 85" stroke="#f59e0b" stroke-width="1.5" />

  <text x="305" y="110" class="t-t">Canvas CORS Blockades</text>
  <text x="305" y="130" class="t-b">- Background photo tainted canvas</text>
  <text x="305" y="145" class="t-b">  blocks user image cards share.</text>

  <text x="305" y="185" class="t-t">API SW Cache Poisoning</text>
  <text x="305" y="205" class="t-b">- Service Worker mistakenly caches</text>
  <text x="305" y="220" class="t-b">  broken API payloads indefinitely.</text>

  <text x="305" y="260" class="t-t">365-day concurrency sync</text>
  <text x="305" y="280" class="t-b">- Bulk request spikes block browser</text>
  <text x="305" y="295" class="t-b">  connection thread pipelines.</text>


  <!-- Moderate Risk Column -->
  <rect x="550" y="40" width="230" height="300" rx="8" class="b-mod" />
  <text x="565" y="70" class="t-lbl-m">MODERATE REGRESSION RISK</text>
  <path d="M 565 85 L 765 85" stroke="#38bdf8" stroke-width="1.5" />

  <text x="565" y="110" class="t-t">Responsive Tour Overlays</text>
  <text x="565" y="130" class="t-b">- Highlighting targets drift out of</text>
  <text x="565" y="145" class="t-b">  correct position on viewport resizing.</text>

  <text x="565" y="185" class="t-t">Gemini JSON Schema Drift</text>
  <text x="565" y="205" class="t-b">- Model engines response formats</text>
  <text x="565" y="220" class="t-b">  violating expected JSON types.</text>

  <text x="565" y="260" class="t-t">Floating context bar shifts</text>
  <text x="565" y="280" class="t-b">- Copy overlay collision blocks</text>
  <text x="565" y="295" class="t-b">  system selectors on iOS Safari.</text>
</svg>
