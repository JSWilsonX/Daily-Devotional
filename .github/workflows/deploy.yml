name: Deploy to Existing AI Studio Service

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: gen-lang-client-0264536181
  SERVICE_NAME: daily-devotionals-reader
  REGION: us-west1
  IMAGE_NAME: us-west1-docker.pkg.dev/gen-lang-client-0264536181/cloud-run-source-deploy/daily-devotionals-reader

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Image to Existing Cloud Run Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},NODE_ENV=production
          flags: --port=3000 --allow-unauthenticated
