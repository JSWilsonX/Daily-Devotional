name: Deploy to Existing AI Studio Service

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: gen-lang-client-0264536181
  SERVICE_NAME: daily-devotionals-reader
  REGION: us-west1
  IMAGE_NAME: us-west1-docker.pkg.dev/gen-lang-client-0264536181/cloud-run-source-deploy/daily-devotionals-reader

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Update system tar and OS libraries on runner host
      - name: Update System Host Packages
        run: |
          sudo apt-get update
          sudo apt-get --only-upgrade install -y tar libgcrypt20 gnupg2

      # 2. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Node.js & Audit Dependencies (Fail on Critical/High)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Fail on Critical or High Npm Vulnerabilities
        run: |
          npm audit --audit-level=high

      # 4. Authenticate to Google Cloud and obtain OAuth2 access token
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      # 4. Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 5. Direct Docker Authentication (bypasses unpatched Go credential helper)
      - name: Configure Docker for Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.auth_token }}" | docker login -u oauth2accesstoken --password-stdin us-west1-docker.pkg.dev

      - name: Build Container Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      # 6. Scan Built Image for High/Critical Vulnerabilities (Fail build if found)
      - name: Scan Image for Vulnerabilities (Fail on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

      # 7. Push Verified Container Image to Registry
      - name: Push Container Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy Image to Existing Cloud Run Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},NODE_ENV=production
          flags: --port=3000 --allow-unauthenticated
