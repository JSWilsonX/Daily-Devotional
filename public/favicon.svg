<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Golden Line Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Warm Glowing Core -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="30%" stop-color="#facc15" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="480" height="480" x="16" y="16" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing Swirls / Celestial Trails -->
  <!-- Outer Swirl 1 -->
  <path d="M 90,320 C 60,200 150,90 256,90 C 370,90 440,190 410,290 C 380,390 280,430 200,410 C 130,390 90,320 110,260" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  
  <!-- Inner Swirl 2 -->
  <path d="M 130,220 C 150,130 240,110 310,140 C 380,170 390,260 340,330 C 290,400 180,380 150,310 C 130,260 160,200 220,190" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6" opacity="0.5"/>

  <!-- Centered Glow behind the Book -->
  <circle cx="256" cy="270" r="140" fill="url(#glowGrad)"/>

  <!-- Sparkling 4-Pointed Stars (Background layer) -->
  <!-- Main top sparkle -->
  <path d="M 256,55 Q 256,75 236,75 Q 256,75 256,95 Q 256,75 276,75 Q 256,75 256,55 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Top Left Sparkle -->
  <path d="M 120,110 Q 120,125 105,125 Q 120,125 120,140 Q 120,125 135,125 Q 120,125 120,110 Z" fill="#fef08a" opacity="0.8"/>
  <!-- Top Right Sparkle -->
  <path d="M 380,110 Q 380,125 365,125 Q 380,125 380,140 Q 380,125 395,125 Q 380,125 380,110 Z" fill="#fef08a" opacity="0.8"/>
  <!-- Bottom Left Sparkle -->
  <path d="M 120,380 Q 120,395 105,395 Q 120,395 120,410 Q 120,395 135,395 Q 120,395 120,380 Z" fill="#fef08a" opacity="0.8"/>
  <!-- Bottom Right Sparkle -->
  <path d="M 380,380 Q 380,395 365,395 Q 380,395 380,410 Q 380,395 395,395 Q 380,395 380,380 Z" fill="#fef08a" opacity="0.8"/>

  <!-- Tiny Stardust dots -->
  <circle cx="190" cy="80" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="320" cy="80" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="90" cy="180" r="2.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="430" cy="180" r="2.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="80" cy="300" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="440" cy="300" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="440" r="2.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="310" cy="440" r="2.5" fill="#fef08a" opacity="0.8"/>

  <!-- GLOWING OPEN BOOK -->
  <g id="book-drawing" transform="translate(0, 15)">
    <!-- Book 3D Shadow / Cover Base -->
    <path d="M 256,325 C 295,302 345,310 395,330 L 405,210 C 355,190 305,182 256,205 C 207,182 157,190 107,210 L 117,330 C 167,310 217,302 256,325 Z" 
          fill="#451a03" stroke="#270f01" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Outer Pages Thickness (Stacked Look) -->
    <path d="M 256,320 C 294,297 342,305 390,325 L 398,205 C 350,185 302,177 256,200 C 210,177 162,185 114,205 L 122,325 C 170,305 218,297 256,320 Z" 
          fill="#d97706" opacity="0.95"/>

    <!-- Active Open Pages (Main Glowing Body) -->
    <!-- Left Page -->
    <path d="M 256,195 C 212,172 166,180 120,200 L 128,315 C 174,295 220,287 256,310 Z" 
          fill="#fef9c3" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right Page -->
    <path d="M 256,195 C 300,172 346,180 392,200 L 384,315 C 338,295 292,287 256,310 Z" 
          fill="#fef9c3" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>

    <!-- Spine details -->
    <path d="M 256,195 L 256,310" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Script / Text lines inside the book -->
    <!-- Left Page Text Lines -->
    <path d="M 145,225 C 165,216 190,210 215,218" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 143,242 C 163,233 188,227 218,234" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 146,259 C 166,250 191,244 221,250" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 148,276 C 168,267 193,261 223,267" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 152,293 C 172,284 197,278 221,283" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page Text Lines -->
    <path d="M 297,218 C 322,210 347,216 367,225" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 294,234 C 319,227 344,233 369,242" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 291,250 C 316,244 341,250 366,259" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 289,267 C 314,261 339,267 364,276" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 291,283 C 315,278 340,284 360,293" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Elegant Vintage Corner Detailing / Filigree -->
    <path d="M 125,208 L 132,205 L 129,215" fill="none" stroke="#78350f" stroke-width="1.5"/>
    <path d="M 387,208 L 380,205 L 383,215" fill="none" stroke="#78350f" stroke-width="1.5"/>
    <path d="M 134,310 L 141,304 L 140,311" fill="none" stroke="#78350f" stroke-width="1.5"/>
    <path d="M 378,310 L 371,304 L 372,311" fill="none" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Giant Golden Star Lightburst coming out of the book -->
  <g transform="translate(256, 275)" opacity="0.95">
    <line x1="0" y1="-85" x2="0" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="drop-shadow(0px 0px 8px #fef08a)"/>
  </g>
</svg>
